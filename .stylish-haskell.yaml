steps:
  - imports:
      align: global          # align 'as' and 'hiding' across all imports
      list_align: after_alias
      long_list_align: inline
      empty_list_align: inherit
      list_padding: 4
      separate_lists: true
      space_surround: false
      post_qualify: false
      group_imports: false
      sort_implicit_imports: false

  - language_pragmas:
      style: vertical
      align: true
      remove_redundant: true

  - simple_align:
      cases: true
      top_level_patterns: true
      records: true

  - trailing_whitespace: {}

columns: 100
newline: native
language_extensions: []
